<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>階段角度計算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --border: #2e2e2e;
    --accent: #f5c842;
    --accent2: #e87d3e;
    --text: #f0ede8;
    --muted: #888;
    --success: #6bcb77;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* 図解SVG */
  .diagram-wrap {
    background: #111;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: center;
  }

  /* インプット */
  .input-row {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .input-group label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .input-group label span {
    color: var(--accent);
  }

  .input-inner {
    display: flex;
    align-items: center;
    background: #111;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .input-inner:focus-within {
    border-color: var(--accent);
  }

  .input-inner input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1.2rem;
    padding: 12px 14px;
    width: 100%;
  }

  .input-inner input::placeholder { color: #444; }

  .unit {
    padding: 12px 14px;
    color: var(--muted);
    font-size: 0.85rem;
    border-left: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
  }

  /* 段数モード */
  .steps-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    cursor: pointer;
  }

  .steps-toggle input[type=checkbox] { display: none; }

  .toggle-track {
    width: 40px;
    height: 22px;
    background: #333;
    border-radius: 100px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: transform 0.2s;
  }

  .steps-toggle input:checked + .toggle-track {
    background: var(--accent);
  }

  .steps-toggle input:checked + .toggle-track::after {
    transform: translateX(18px);
  }

  .toggle-label {
    font-size: 0.82rem;
    color: var(--muted);
  }

  .steps-input {
    display: none;
    margin-top: 10px;
  }

  .steps-input.visible { display: block; }

  /* 結果 */
  .result-card {
    background: var(--card);
    border: 1.5px solid var(--accent);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
    display: none;
  }

  .result-card.visible { display: block; }

  .angle-display {
    text-align: center;
    margin-bottom: 16px;
  }

  .angle-number {
    font-size: 4rem;
    font-weight: 900;
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    line-height: 1;
  }

  .angle-unit {
    font-size: 1.5rem;
    color: var(--accent2);
    font-weight: 700;
  }

  .angle-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .result-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  .detail-item {
    background: #111;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }

  .detail-value {
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text);
  }

  .detail-label {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 3px;
  }

  /* 基準判定 */
  .standard-bar {
    margin-top: 14px;
    background: #111;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .standard-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .standard-text {
    font-size: 0.82rem;
    line-height: 1.5;
  }

  /* SVGアニメーション */
  #angle-arc {
    transition: all 0.5s ease;
  }

  /* ボタン */
  .calc-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    padding: 16px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    margin-bottom: 16px;
    letter-spacing: 0.05em;
  }

  .calc-btn:active { transform: scale(0.97); opacity: 0.85; }

  .error-msg {
    color: #ff6b6b;
    font-size: 0.82rem;
    margin-top: 8px;
    display: none;
  }
  .error-msg.visible { display: block; }
</style>
</head>
<body>

<header>
  <h1>📐 階段角度計算</h1>
  <p>メジャーだけで角度がわかる</p>
</header>

<!-- 図解 -->
<div class="card">
  <div class="card-title">測り方</div>
  <div class="diagram-wrap">
    <svg id="diagram" width="280" height="160" viewBox="0 0 280 160">
      <!-- 背景グリッド -->
      <line x1="0" y1="150" x2="280" y2="150" stroke="#333" stroke-width="1"/>

      <!-- 階段の形 -->
      <polyline points="20,150 20,110 80,110 80,70 140,70 140,30 200,30"
        fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>

      <!-- 斜辺（メインライン） -->
      <line id="hyp-line" x1="20" y1="150" x2="200" y2="30"
        stroke="#f5c842" stroke-width="2.5"/>

      <!-- 角度の弧 -->
      <path id="angle-arc" d="M 60,150 A 40,40 0 0,1 20,116" fill="none" stroke="#e87d3e" stroke-width="2"/>
      <text id="angle-text" x="68" y="145" fill="#e87d3e" font-size="11" font-family="DM Mono">θ</text>

      <!-- 踏面 矢印 -->
      <line x1="20" y1="155" x2="200" y2="155" stroke="#6bcb77" stroke-width="1.5" marker-end="url(#arr-g)" marker-start="url(#arr-g2)"/>
      <text x="100" y="168" fill="#6bcb77" font-size="10" text-anchor="middle" font-family="Noto Sans JP">踏面の合計</text>

      <!-- 蹴上 矢印 -->
      <line x1="210" y1="30" x2="210" y2="150" stroke="#7eb8f7" stroke-width="1.5" marker-end="url(#arr-b)" marker-start="url(#arr-b2)"/>
      <text x="248" y="95" fill="#7eb8f7" font-size="10" text-anchor="middle" font-family="Noto Sans JP" transform="rotate(90,248,95)">蹴上の合計</text>

      <defs>
        <marker id="arr-g" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#6bcb77"/>
        </marker>
        <marker id="arr-g2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
          <path d="M0,0 L6,3 L0,6 Z" fill="#6bcb77"/>
        </marker>
        <marker id="arr-b" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#7eb8f7"/>
        </marker>
        <marker id="arr-b2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
          <path d="M0,0 L6,3 L0,6 Z" fill="#7eb8f7"/>
        </marker>
      </defs>
    </svg>
  </div>
</div>

<!-- 入力 -->
<div class="card">
  <div class="card-title">寸法を入力</div>

  <!-- 段数モード切替 -->
  <label class="steps-toggle" style="margin-bottom:16px;">
    <input type="checkbox" id="multi-toggle" onchange="toggleMulti()">
    <div class="toggle-track"></div>
    <span class="toggle-label">複数段まとめて測る（より正確）</span>
  </label>

  <div class="input-row">
    <div class="input-group">
      <label>🟢 <span>踏面</span>（水平・奥行き）</label>
      <div class="input-inner">
        <input type="number" id="fumimen" placeholder="250" inputmode="decimal" min="1">
        <span class="unit">mm</span>
      </div>
    </div>

    <div class="input-group">
      <label>🔵 <span>蹴上げ</span>（垂直・高さ）</label>
      <div class="input-inner">
        <input type="number" id="keriage" placeholder="200" inputmode="decimal" min="1">
        <span class="unit">mm</span>
      </div>
    </div>

    <!-- 段数（複数モード時） -->
    <div class="steps-input" id="steps-field">
      <div class="input-group">
        <label>段数</label>
        <div class="input-inner">
          <input type="number" id="steps" placeholder="5" inputmode="numeric" min="1">
          <span class="unit">段</span>
        </div>
      </div>
      <p style="font-size:0.75rem;color:#666;margin-top:6px;">※ 複数段まとめた寸法を入力してください</p>
    </div>
  </div>

  <p class="error-msg" id="error">踏面と蹴上げを入力してください</p>
</div>

<button class="calc-btn" onclick="calculate()">角度を計算する</button>

<!-- 結果 -->
<div class="result-card" id="result-card">
  <div class="angle-display">
    <div>
      <span class="angle-number" id="result-angle">--</span>
      <span class="angle-unit">°</span>
    </div>
    <div class="angle-label">階段の勾配角度</div>
  </div>

  <div class="result-details">
    <div class="detail-item">
      <div class="detail-value" id="res-fumimen">--</div>
      <div class="detail-label">踏面 (mm)</div>
    </div>
    <div class="detail-item">
      <div class="detail-value" id="res-keriage">--</div>
      <div class="detail-label">蹴上げ (mm)</div>
    </div>
    <div class="detail-item">
      <div class="detail-value" id="res-ratio">--</div>
      <div class="detail-label">勾配 (蹴/踏)</div>
    </div>
    <div class="detail-item">
      <div class="detail-value" id="res-percent">-- %</div>
      <div class="detail-label">勾配率</div>
    </div>
  </div>

  <div class="standard-bar" id="standard-bar">
    <div class="standard-dot" id="standard-dot"></div>
    <div class="standard-text" id="standard-text"></div>
  </div>
</div>

<script>
  function toggleMulti() {
    const on = document.getElementById('multi-toggle').checked;
    document.getElementById('steps-field').classList.toggle('visible', on);
  }

  function calculate() {
    const errEl = document.getElementById('error');
    const f = parseFloat(document.getElementById('fumimen').value);
    const k = parseFloat(document.getElementById('keriage').value);

    if (!f || !k || f <= 0 || k <= 0) {
      errEl.classList.add('visible');
      document.getElementById('result-card').classList.remove('visible');
      return;
    }
    errEl.classList.remove('visible');

    const angle = Math.atan(k / f) * (180 / Math.PI);
    const ratio = k / f;
    const percent = ratio * 100;

    // 表示
    document.getElementById('result-angle').textContent = angle.toFixed(1);
    document.getElementById('res-fumimen').textContent = f.toFixed(0);
    document.getElementById('res-keriage').textContent = k.toFixed(0);
    document.getElementById('res-ratio').textContent = ratio.toFixed(3);
    document.getElementById('res-percent').textContent = percent.toFixed(1) + ' %';

    // 基準判定（建築基準法：住宅の階段 蹴上≤230mm 踏面≥150mm）
    const dot = document.getElementById('standard-dot');
    const txt = document.getElementById('standard-text');

    if (k <= 230 && f >= 150) {
      dot.style.background = '#6bcb77';
      txt.innerHTML = '✅ <strong style="color:#6bcb77">建築基準法の基準内</strong><br><span style="color:#888;font-size:0.75rem">住宅階段：蹴上≤230mm・踏面≥150mm</span>';
    } else {
      dot.style.background = '#ff6b6b';
      txt.innerHTML = '⚠️ <strong style="color:#ff6b6b">基準を超えています</strong><br><span style="color:#888;font-size:0.75rem">住宅階段：蹴上≤230mm・踏面≥150mm</span>';
    }

    document.getElementById('result-card').classList.add('visible');

    // 図のアニメーション更新（角度に応じた斜辺の傾き）
    updateDiagram(angle);
  }

  function updateDiagram(angle) {
    const rad = angle * Math.PI / 180;
    const len = 190;
    const x1 = 20, y1 = 150;
    const x2 = x1 + len * Math.cos(rad);
    const y2 = y1 - len * Math.sin(rad);
    document.getElementById('hyp-line').setAttribute('x1', x1);
    document.getElementById('hyp-line').setAttribute('y1', y1);
    document.getElementById('hyp-line').setAttribute('x2', x2.toFixed(1));
    document.getElementById('hyp-line').setAttribute('y2', y2.toFixed(1));

    // 弧
    const arcR = 45;
    const ax = x1 + arcR * Math.cos(rad);
    const ay = y1 - arcR * Math.sin(rad);
    document.getElementById('angle-arc').setAttribute('d',
      `M ${x1 + arcR},${y1} A ${arcR},${arcR} 0 0,1 ${ax.toFixed(1)},${ay.toFixed(1)}`
    );
  }
</script>
</body>
</html>
